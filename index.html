<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ShiftPilot – Dienstplanung</title>
<style>
:root{
  --bg:#08111f; --bg2:#0b1524; --panel:#101d2d; --panel2:#132338; --line:#21334a;
  --text:#f4f8ff; --muted:#8fa4bf; --teal:#27d6b4; --teal2:#18b99a;
  --blue:#5b8cff; --amber:#ffb84d; --violet:#a978ff; --pink:#ff6f9d; --cyan:#42d3df;
  --danger:#ff6677; --good:#3fe0a5; --shadow:0 20px 60px rgba(0,0,0,.28);
  --radius:14px; --sidebar:235px;
}
*{box-sizing:border-box} html,body{height:100%} body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#04080e;color:var(--text);font-size:15px}
button,input,select,textarea{font:inherit} button{cursor:pointer}
.app{min-height:100vh;background:var(--bg);display:grid;grid-template-columns:var(--sidebar) 1fr;grid-template-rows:64px 1fr}
.sidebar{grid-row:1/3;background:#07101b;border-right:1px solid #142237;padding:18px 14px;display:flex;flex-direction:column;min-width:0}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;padding:4px 10px 18px}.logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--teal),#5effd6);display:grid;place-items:center;color:#06251f;font-weight:900}.brand span:last-child{color:#f7fbff}.brand em{font-style:normal;color:var(--teal)}
.company-card{border:1px solid #1f3148;background:#0d1827;border-radius:11px;padding:13px;display:grid;grid-template-columns:34px 1fr 16px;gap:10px;align-items:center;margin:0 2px 14px}.company-icon{width:34px;height:34px;border-radius:9px;background:#25d6b6;color:#062d25;display:grid;place-items:center;font-weight:800}.company-card b{font-size:13px}.company-card small{display:block;color:var(--muted);margin-top:3px}
.nav{display:flex;flex-direction:column;gap:5px}.nav button{width:100%;border:0;background:transparent;color:#95a9c2;border-radius:9px;padding:11px 12px;display:flex;align-items:center;gap:11px;text-align:left}.nav button:hover,.nav button.active{background:#10263a;color:#dffef7}.nav button.active{box-shadow:inset 3px 0 0 var(--teal)}.nav .badge{margin-left:auto;background:#ff5e66;color:#fff;border-radius:99px;padding:1px 6px;font-size:11px}
.side-bottom{margin-top:auto;border-top:1px solid #17263a;padding-top:12px}.user-row{display:flex;align-items:center;gap:10px;padding:10px}.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#203650;color:#dfeaff;font-size:12px;font-weight:700}.user-row small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.topbar{grid-column:2;grid-row:1;background:#0d1828;border-bottom:1px solid #1a2b41;display:flex;align-items:center;padding:0 24px;gap:18px}.search{position:relative;width:min(360px,42vw)}.search input{width:100%;background:#0b1625;border:1px solid #24364d;color:#dce8f7;border-radius:9px;padding:10px 38px 10px 36px;outline:none}.search:before{content:"⌕";position:absolute;left:12px;top:8px;color:#7890aa}.kbd{position:absolute;right:8px;top:8px;border:1px solid #2a3b51;border-radius:5px;color:#6f87a2;font-size:11px;padding:2px 6px}.top-actions{margin-left:auto;display:flex;align-items:center;gap:9px}.iconbtn,.primary{border:1px solid #26384f;background:#111e2e;color:#c8d6e7;border-radius:8px;padding:9px 11px}.primary{background:var(--teal);border-color:var(--teal);color:#05261f;font-weight:800}.primary:hover{background:#3ae1c1}.iconbtn:hover{background:#17283b}
.main{grid-column:2;grid-row:2;padding:26px 28px 40px;overflow:auto}.content{max-width:1360px;margin:0 auto}.eyebrow{color:var(--teal);font-size:11px;letter-spacing:.16em;font-weight:800}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:16px}.page-head h1{font-size:28px;margin:5px 0 4px}.page-head p{margin:0;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:12px 0}.stat{background:#0f1c2d;border:1px solid #21334a;border-radius:12px;padding:14px;display:grid;grid-template-columns:42px 1fr;gap:10px;align-items:center}.stat-icon{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;background:#dff8f2;color:#0b6e5b}.stat:nth-child(2) .stat-icon{background:#e7efff;color:#4269d5}.stat:nth-child(3) .stat-icon{background:#fff0db;color:#d0811c}.stat:nth-child(4) .stat-icon{background:#f0e8ff;color:#8559d4}.stat small{color:var(--muted);font-size:11px}.stat strong{display:block;font-size:22px;margin-top:3px}.stat em{display:block;font-style:normal;font-size:11px;color:var(--teal);margin-top:4px}
.card{background:#0f1b2b;border:1px solid #21334a;border-radius:13px;box-shadow:var(--shadow)}
.library{padding:16px;margin-top:10px}.library-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.library h3{margin:0 0 3px;font-size:15px}.library p{margin:0;color:var(--muted);font-size:12px}.shift-row{display:flex;gap:10px;overflow:auto;padding-bottom:2px}.shift-chip{min-width:136px;border-radius:9px;background:#101d2f;border:1px solid currentColor;padding:11px 12px;color:#9b83ff;position:relative}.shift-chip b{color:#fff;font-size:14px}.shift-chip small{display:block;color:#9badc1;margin-top:6px;font-size:10px}.shift-chip.blue{color:#62a0ff}.shift-chip.amber{color:#ffbd4f}.shift-chip.cyan{color:#38d7d4}.shift-chip.pink{color:#ff6f9d}.shift-chip.teal{color:#2ed9b8}.shift-chip.violet{color:#8f7dff}.dots{position:absolute;right:8px;top:6px;color:#7c8ea4}
.calendar{margin-top:12px;overflow:hidden}.cal-toolbar{display:flex;align-items:center;padding:10px 12px;border-bottom:1px solid #203248;gap:9px}.ghost{border:1px solid #24384f;background:#0e1928;color:#aabbd0;border-radius:7px;padding:7px 10px}.date-label{font-weight:800;margin-left:8px}.toolbar-spacer{margin-left:auto}.seg{display:flex;border:1px solid #24384f;border-radius:8px;overflow:hidden}.seg button{border:0;background:#0e1928;color:#8fa4bd;padding:8px 12px}.seg button.active{background:#17283a;color:#fff}.cal-grid{display:grid;grid-template-columns:68px repeat(7,1fr);min-height:560px}.time-col,.day-col{border-right:1px solid #203248}.time-head,.day-head{height:52px;border-bottom:1px solid #203248;display:flex;align-items:center;justify-content:center;color:#8ca0b8;font-size:11px}.day-head b{color:#dce7f5;font-size:13px;margin-left:7px}.day-head.today b{background:var(--teal);color:#063027;border-radius:50%;width:30px;height:30px;display:inline-grid;place-items:center}.time-slot{height:86px;border-bottom:1px solid #1b2c40;padding:8px 8px;color:#7890aa;font-size:10px}.day-body{position:relative}.day-slot{height:86px;border-bottom:1px solid #1b2c40}.day-col.today .day-body{background:rgba(39,214,180,.06)}
.assignment{position:absolute;left:8px;right:8px;border-radius:8px;padding:8px 9px;color:#fff;font-size:11px;box-shadow:0 6px 14px rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.15)}.assignment b{display:block}.assignment span{display:block;opacity:.85;margin-top:2px}.ass-teal{background:#123e39}.ass-blue{background:#1a305a}.ass-amber{background:#4a3717}.ass-violet{background:#312653}.ass-pink{background:#4b2032}.ass-cyan{background:#163c43}.ass-red{background:#542333}
.sollist{border-top:1px solid #203248;display:grid;grid-template-columns:68px repeat(7,1fr);background:#0c1725}.soll-day{border-right:1px solid #203248;padding:9px;min-height:74px}.soll-day small{display:block;color:#7890aa;margin-bottom:5px}.pillline{display:flex;flex-wrap:wrap;gap:4px}.pill{padding:3px 6px;border-radius:999px;background:#16283b;color:#9fb1c6;font-size:10px;border:1px solid #25394e}.pill.warn{color:#ffd19a;border-color:#74531c;background:#2c2518}.pill.good{color:#9ef4d4;border-color:#1d6d57;background:#123127}
.view{display:none}.view.active{display:block}
.panel-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.table-card{padding:14px}.table-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}.table-head h3{margin:0}.table-head input,.table-head select,.form input,.form select,.form textarea{background:#0c1827;border:1px solid #24384f;color:#e8f2ff;border-radius:8px;padding:9px 10px;outline:none}.table-head input{margin-left:auto;min-width:240px}.employee-list{display:flex;flex-direction:column;gap:8px}.emp{display:grid;grid-template-columns:38px 1.2fr .75fr .75fr .9fr auto;gap:10px;align-items:center;padding:10px;border:1px solid #203248;border-radius:10px;background:#0d1928}.emp:hover{background:#102033}.emp small{display:block;color:var(--muted);margin-top:3px}.status{font-size:11px;border-radius:999px;padding:4px 8px;width:max-content}.status.active{background:#12382f;color:#70e6be}.status.inactive{background:#2c2731;color:#bfacbf}.tagset{display:flex;gap:4px;flex-wrap:wrap}.tag{font-size:10px;padding:3px 6px;border-radius:999px;background:#16283b;color:#b5c4d6}.form-card{padding:16px}.form-card h3{margin-top:0}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form label{display:flex;flex-direction:column;gap:5px;color:#9db0c7;font-size:12px}.form .full{grid-column:1/-1}.checks{display:flex;flex-wrap:wrap;gap:8px}.check{border:1px solid #2a3e55;border-radius:8px;padding:7px 9px;color:#aebed0;font-size:12px}.check input{margin-right:5px}.form-actions{grid-column:1/-1;display:flex;gap:8px;margin-top:5px}.danger{background:#3a1720;border:1px solid #6f2734;color:#ff9aa7;border-radius:8px;padding:9px 12px}.notice{border:1px solid #684e23;background:#2d2415;color:#ffd18d;border-radius:9px;padding:10px;margin-top:12px;font-size:12px}.empty{color:#8196ad;padding:20px;text-align:center}
.save-toast{position:fixed;right:24px;bottom:24px;z-index:9999;display:flex;align-items:center;gap:10px;min-width:280px;max-width:420px;padding:13px 15px;border:1px solid #1f6f5a;border-radius:10px;background:#0f2d26;color:#c9fff0;box-shadow:0 14px 40px rgba(0,0,0,.35);font-size:13px;font-weight:600;opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .2s ease,transform .2s ease}.save-toast.show{opacity:1;transform:translateY(0)}.save-toast .toast-icon{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#1d6f5b;color:#d7fff2;font-weight:900}.save-toast small{display:block;color:#91d8c5;font-weight:500;margin-top:2px}
@media(max-width:1050px){:root{--sidebar:195px}.stats{grid-template-columns:repeat(2,1fr)}.panel-grid{grid-template-columns:1fr}.cal-grid,.sollist{min-width:1050px}.calendar{overflow:auto}.emp{grid-template-columns:38px 1fr .7fr auto}.emp>:nth-child(4),.emp>:nth-child(5){display:none}}
</style>
</head>
