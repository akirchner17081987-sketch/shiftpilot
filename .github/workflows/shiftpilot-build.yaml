# To better understand this file read this:
# https://docs.ionos.space/docs/github-actions-customization/

name: "Deploy Now: Execute Build"

on:
  workflow_call:
    inputs:
      site-url:
        required: true
        type: string
      branch-id:
        required: true
        type: string

env:
  DEPLOYMENT_FOLDER: dist

jobs:
# Please do not rename this job
  build-project:
    name: build shiftpilot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: v22.x
          cache: npm

      - name: Build Node assets
        env:
          CI: true
          SITE_URL: ${{ inputs.site-url }}
        run: |
          npm ci
          npm run build

      - name: Verify IONOS migration
        run: |
          npm test
          npm run test:ionos

      - name: Verify browser workflows and complete exports
        run: |
          npx playwright install chromium
          node tests/browser/company-profile-qa.cjs
          node tests/browser/access-mfa-matrix-qa.cjs
          node tests/browser/qr-pin-qa.cjs
          node tests/browser/qr-desktop-qa.cjs
          node tests/browser/reports-workspace-qa.cjs
          node tests/browser/today-workspace-qa.cjs
          node tests/browser/staffing-simulator-qa.cjs
          node tests/browser/wish-planning-qa.cjs
          node tests/browser/shift-handover-qa.cjs
          node tests/browser/handover-reminders-qa.cjs
          node tests/browser/planning-performance-qa.cjs
          node tests/browser/site-loading-qa.cjs
          node tests/browser/entry-access-qa.cjs
          node tests/browser/pwa-reliability-qa.cjs
          node tests/browser/entry-location-qa.cjs
          node tests/browser/entry-globe-transform-qa.cjs
          node tests/browser/portal-entry-routing-qa.cjs
          node tests/browser/manual-week-planning-qa.cjs
          node tests/browser/manual-range-planning-qa.cjs
          node tests/browser/disruption-replacement-qa.cjs
          node tests/browser/location-geocode-qa.cjs
          node tests/browser/planning-continuity-qa.cjs
          npx playwright test tests/e2e/auto-plan-workspace.spec.cjs --grep "equal 180-hour targets|automatic repair|final audit" --retries=0

# Please do not touch the following action
      - name: Store deployment content
        uses: ionos-deploy-now/artifact-action@v1
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-eu.ionos.space
          project-id: 7bc70ac7-ec3b-4e7b-bae5-569c957e8514
          branch-id: ${{ inputs.branch-id }}
          version: ${{ github.sha }}
          folder: ${{ env.DEPLOYMENT_FOLDER }}
          config-file: .deploy-now/shiftpilot/config.yaml
          action: upload

