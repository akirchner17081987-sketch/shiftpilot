name: Auto-Planung Assistent Layoutprüfung
on:
  push:
    branches: [main, codex/ionos-migration, codex/assistant-clearance-20261006]
    paths:
      - index.html
      - assets/planning-assistant-v1.js
      - assets/planning-assistant-v1.css
      - tests/e2e/auto-plan-assistant-layout.spec.cjs
      - tests/browser/planning-assistant-fixture.cjs
      - .github/workflows/auto-plan-assistant-layout-checks.yml
  pull_request:
    paths:
      - assets/planning-assistant-v1.js
      - assets/planning-assistant-v1.css
      - tests/e2e/auto-plan-assistant-layout.spec.cjs
      - .github/workflows/auto-plan-assistant-layout-checks.yml
jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install ffmpeg
      - run: npx playwright test tests/e2e/auto-plan-assistant-layout.spec.cjs tests/e2e/planning-assistant.spec.cjs --project=desktop-chromium --retries=0 --max-failures=3
        env:
          E2E_BASE_URL: http://auto-assistant.test
          SF_ASSISTANT_BROWSER_EXECUTABLE: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auto-plan-assistant-layout-results
          path: |
            playwright-report/
            test-results/
