name: Apply Direct Selected Assignment
on:
  push:
    paths:
      - 'scripts/apply_direct_selected_assignment.py'
      - '.github/workflows/apply-direct-selected-assignment.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/apply_direct_selected_assignment.py
      - name: Commit updated app
        run: |
          git config user.name "shiftpilot-bot"
          git config user.email "shiftpilot-bot@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Dienstplan: ausgewählte Schicht und Mitarbeiter direkt eintragen"
          git push
