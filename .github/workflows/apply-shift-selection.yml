name: Apply Shift Selection Highlight

on:
  push:
    paths:
      - 'scripts/apply_shift_selection.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply selection highlight
        run: python scripts/apply_shift_selection.py
      - name: Commit updated app
        run: |
          git config user.name "shiftpilot-bot"
          git config user.email "shiftpilot-bot@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Schichtbibliothek: aktive Schicht markieren"
          git push
