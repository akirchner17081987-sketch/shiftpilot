name: Open shift marketplace checks
on:
  pull_request:
    paths:
      - 'assets/*marketplace*'
      - 'assets/supabase-shift-swap-v1.js'
      - 'supabase/migrations/*shift_swap*'
      - 'tests/shift-swap-availability.test.mjs'
      - 'tests/sql/*market*rollback.sql'
      - 'tests/sql/shift-swap-rollback.sql'
      - 'tests/browser/shift-swap-workflow-qa.cjs'
      - 'assets/supabase-delta-sync-v1.js'
      - 'assets/auto-plan-workspace-v1.js'
      - 'tests/*marketplace*'
      - 'tests/browser/open-shift-marketplace-qa.cjs'
      - '.github/workflows/open-shift-marketplace-checks.yml'
  push:
    branches: [main, codex/ionos-migration, codex/open-shift-marketplace]
    paths:
      - 'assets/*marketplace*'
      - 'assets/supabase-shift-swap-v1.js'
      - 'supabase/migrations/*shift_swap*'
      - 'tests/shift-swap-availability.test.mjs'
      - 'tests/sql/*market*rollback.sql'
      - 'tests/sql/shift-swap-rollback.sql'
      - 'tests/browser/shift-swap-workflow-qa.cjs'
      - 'assets/supabase-delta-sync-v1.js'
      - 'tests/*marketplace*'
      - 'tests/browser/open-shift-marketplace-qa.cjs'
      - '.github/workflows/open-shift-marketplace-checks.yml'
permissions:
  contents: read
# Superseded checks may stop; deployment workflows use separate, protected groups.
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  marketplace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/auto-plan-workspace.test.mjs tests/open-shift-marketplace.test.mjs tests/shift-swap-availability.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser/open-shift-marketplace-qa.cjs
      - run: node tests/browser/shift-swap-workflow-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marketplace-browser-screenshots
          path: |
            test-results/marketplace-*.png
            test-results/shift-swap/*.png


  verify-live:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/ionos-migration'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify published marketplace controls and schedule markers
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import {setTimeout as delay} from 'node:timers/promises';
          const files=['assets/open-shift-marketplace-v1.js','assets/open-shift-marketplace-v1.css','assets/supabase-shift-marketplace-v1.js'];
          const hash=b=>createHash('sha256').update(b).digest('hex');
          for(let attempt=0;attempt<110;attempt++){
            try{for(const file of files){const r=await fetch('https://schichtfunk.de/'+file+'?market_release='+process.env.GITHUB_SHA,{signal:AbortSignal.timeout(15000)});if(!r.ok||hash(Buffer.from(await r.arrayBuffer()))!==hash(readFileSync(file)))throw Error(file+' differs');}console.log('Marketplace controls and schedule markers match release.');break;}
            catch(error){if(attempt===109)throw error;console.log(error.message);await delay(15000);}
          }
          NODE
