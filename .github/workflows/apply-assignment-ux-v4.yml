name: Apply assignment UX V4
on:
  push:
    branches: [main]
    paths:
      - 'assets/assignment-ux-v4.css'
      - 'assets/assignment-ux-v4.js'
      - '.github/workflows/apply-assignment-ux-v4.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link assignment UX assets into index
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="assets/assignment-ux-v4.css">'
          js='<script src="assets/assignment-ux-v4.js"></script>'
          changed=False
          if css not in s:
              s=s.replace('</head>', css+'\n</head>')
              changed=True
          if js not in s:
              s=s.replace('</body>', js+'\n</body>')
              changed=True
          if changed:
              p.write_text(s,encoding='utf-8')
      - name: Basic checks
        run: |
          grep -q 'assets/assignment-ux-v4.css' index.html
          grep -q 'assets/assignment-ux-v4.js' index.html
          grep -q 'spAssignmentConflict' assets/assignment-ux-v4.js
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "Assignment UX V4 already linked."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Dienstplan: Schichtzuweisung UX V4 aktivieren"
          git push
