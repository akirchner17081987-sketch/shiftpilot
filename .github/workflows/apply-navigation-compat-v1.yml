name: Apply Navigation Compatibility V1
on:
  push:
    branches: [main]
    paths:
      - 'assets/navigation-compat-v1.js'
      - '.github/workflows/apply-navigation-compat-v1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link navigation compatibility asset
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          js='<script src="assets/navigation-compat-v1.js"></script>'
          if js not in s:
              s=s.replace('</body>',js+'\n</body>')
              p.write_text(s,encoding='utf-8')
      - name: Basic checks
        run: |
          grep -q 'navigation-compat-v1.js' index.html
          grep -q 'window.showView' assets/navigation-compat-v1.js
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "Navigation compatibility already linked."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Navigation: alte und neue View-Aufrufe vereinheitlichen"
          git push
