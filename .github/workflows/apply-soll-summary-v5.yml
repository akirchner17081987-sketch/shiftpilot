name: Apply SOLL IST Summary V5
on:
  push:
    branches: [main]
    paths:
      - 'assets/soll-summary-v5.css'
      - 'assets/soll-summary-v5.js'
      - '.github/workflows/apply-soll-summary-v5.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link SOLL IST summary assets into index
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="assets/soll-summary-v5.css">'
          js='<script src="assets/soll-summary-v5.js"></script>'
          changed=False
          if css not in s:
              s=s.replace('</head>', css+'\n</head>')
              changed=True
          if js not in s:
              s=s.replace('</body>', js+'\n</body>')
              changed=True
          if changed:
              p.write_text(s,encoding='utf-8')
      - name: Basic checks
        run: |
          grep -q 'assets/soll-summary-v5.css' index.html
          grep -q 'assets/soll-summary-v5.js' index.html
          grep -q 'sp-soll-toggle' assets/soll-summary-v5.js
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "SOLL IST Summary V5 already linked."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Dienstplan: kompakte SOLL-IST Zusammenfassung aktivieren"
          git push
