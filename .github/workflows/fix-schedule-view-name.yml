name: Fix Schedule View Name

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_schedule_view_name.py'
      - '.github/workflows/fix-schedule-view-name.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply schedule view fix
        run: python scripts/fix_schedule_view_name.py
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Übersicht: Dienstplan korrekt auf schedule verknüpfen"
          git push
