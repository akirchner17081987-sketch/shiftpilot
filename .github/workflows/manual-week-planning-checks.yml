name: Manual week planning checks
on:
  push:
    branches: [codex/manual-week-planning-20261013, codex/compact-week-timetable-20261013, codex/inline-duty-picker-20261013, codex/inline-picker-roster-fix-20261013, codex/ot-daily-roster-20261014, codex/teamleader-four-nights-20261014, codex/weekly-55-hours-20261014, codex/teamleader-month-targets-20261014]
permissions:
  contents: read
jobs:
  manual-week:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:ionos
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser/manual-week-planning-qa.cjs
      - run: npx playwright test tests/e2e/manager-typography.spec.cjs tests/e2e/schedule-time-layout.spec.cjs --project=desktop-chromium --retries=0 --max-failures=3
        env:
          E2E_BASE_URL: http://workspace-layout.test
      - run: node tests/browser/site-loading-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-week-planning-qa
          path: test-results
          retention-days: 7
