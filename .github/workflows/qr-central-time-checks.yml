name: QR zentrale Zeiterfassung
on:
  push:
    branches: [main, codex/ionos-migration, codex/qr-central-20261006]
    paths: ['assets/**', 'tests/**', 'supabase/migrations/20261006030128_qr_central_time_integration.sql', 'package.json', '.github/workflows/qr-central-time-checks.yml']
jobs:
  central-time:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fictitious-ci-password
          POSTGRES_DB: qr_central_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Validate migration and company scopes in isolated PostgreSQL
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/sql/qr-central-bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261006030128_qr_central_time_integration.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/qr-central-integration.sql
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: fictitious-ci-password
          PGDATABASE: qr_central_test
      - name: Independent Chromium with intercepted fictitious data
        run: npx playwright test tests/e2e/qr-central-time.spec.cjs --retries=0 --max-failures=2
        env:
          E2E_BASE_URL: http://qr-central.test
          SF_CENTRAL_BROWSER_EXECUTABLE: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qr-central-time-results
          path: |
            playwright-report/
            test-results/
