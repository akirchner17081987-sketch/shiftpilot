name: SchichtFunk Datumsauswahl
on:
  pull_request:
    paths:
      - assets/date-picker-v1.*
      - assets/date-month-format-v1.js
      - assets/date-month-controls-v1.css
      - assets/navigation-compat-v1.js
      - tests/e2e/date-picker.spec.cjs
      - .github/workflows/date-picker-checks.yml
  push:
    branches: [main, codex/ionos-migration, codex/schichtfunk-datumsauswahl-20261001]
    paths:
      - assets/date-picker-v1.*
      - assets/date-month-format-v1.js
      - assets/date-month-controls-v1.css
      - assets/navigation-compat-v1.js
      - tests/e2e/date-picker.spec.cjs
      - .github/workflows/date-picker-checks.yml
permissions:
  contents: read
jobs:
  date-picker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/date-month-controls.test.mjs tests/manager-theme.test.mjs tests/auto-plan-workspace.test.mjs
      - run: npx playwright test tests/e2e/date-picker.spec.cjs --workers=1
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: datumsauswahl-pruefergebnisse
          path: test-results/
          retention-days: 7
