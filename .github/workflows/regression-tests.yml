name: Regressionstests

on:
  push:
    branches: [main]
    # These isolated fixture edits are covered by schedule-module-checks.yml.
    # Do not start the production-login suite for a test-environment repair.
    paths-ignore:
      - tests/e2e/employee-planning-teams.spec.cjs
      - .github/workflows/schedule-module-checks.yml
      - .github/workflows/regression-tests.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Statische Regressionstests ausführen
        run: npm test
      - name: Chromium für Produktions-Browsertests installieren
        if: github.event_name != 'pull_request'
        run: npx playwright install --with-deps chromium
      - name: Browserabläufe gegen Produktion ausführen
        if: github.event_name != 'pull_request'
        run: npm run test:e2e
        env:
          E2E_BASE_URL: https://shiftpilot-two.vercel.app
          SF_E2E_EMAIL: ${{ secrets.SF_E2E_EMAIL }}
          SF_E2E_PASSWORD: ${{ secrets.SF_E2E_PASSWORD }}
