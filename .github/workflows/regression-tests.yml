name: Regressionstests

on:
  push:
    branches: [main]
    # These isolated fixture edits are covered by schedule-module-checks.yml.
    # Do not start the production-login suite for a test-environment repair.
    paths-ignore:
      - tests/e2e/employee-planning-teams.spec.cjs
      - .github/workflows/schedule-module-checks.yml
      - .github/workflows/regression-tests.yml
  pull_request:
  workflow_dispatch:
    inputs:
      run_production_browser:
        description: 'Explicitly run the authenticated production browser suite'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  storage-backup-drill:
    name: Encrypted Storage restore drill (fictitious data only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Install backup tool from the signed OS package repository
        run: sudo apt-get update -qq && sudo apt-get install -y restic rclone
      - name: Require a real encrypted backup and restore
        env:
          SF_BACKUP_REQUIRE_DRILL: '1'
        run: node --test tests/storage-backup.test.mjs
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Existing QR Edge tests import node:module.stripTypeScriptTypes.
          node-version: '24.x'
          cache: npm
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Statische Regressionstests ausführen
        run: npm test
      - name: Chromium für Produktions-Browsertests installieren
        if: github.event_name == 'workflow_dispatch' && inputs.run_production_browser
        run: npx playwright install --with-deps chromium
      - name: Browserabläufe gegen Produktion ausführen
        if: github.event_name == 'workflow_dispatch' && inputs.run_production_browser
        run: npm run test:e2e
        env:
          E2E_BASE_URL: https://shiftpilot-two.vercel.app
          SF_E2E_EMAIL: ${{ secrets.SF_E2E_EMAIL }}
          SF_E2E_PASSWORD: ${{ secrets.SF_E2E_PASSWORD }}
