name: Apply schedule UX V2
on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_schedule_ux_v2.py'
      - '.github/workflows/apply-schedule-ux-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply schedule UX improvements
        run: python3 scripts/apply_schedule_ux_v2.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Dienstplan: Lesbarkeit und Bedienkomfort verbessern"
          git push
