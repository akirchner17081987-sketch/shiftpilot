name: Planungsteams und Rhythmusprüfung
on:
  push:
    branches: [main, codex/ionos-migration]
    paths:
      - assets/employee-management-v2.js
      - assets/planning-teams-v1.js
      - assets/settings-management-v2.js
      - assets/supabase-data-v1.js
      - tests/planning-team-rules.test.mjs
      - assets/employee-rhythm-v1.js
      - tests/employee-planning-teams.test.mjs
      - tests/e2e/employee-planning-teams.spec.cjs
      - tests/e2e/auto-plan-workspace.spec.cjs
      - .github/workflows/employee-planning-teams.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/planning-team-rules.test.mjs tests/employee-planning-teams.test.mjs tests/employee-status.test.mjs tests/employee-fixed-shifts.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/employee-planning-teams.spec.cjs tests/e2e/auto-plan-workspace.spec.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: planning-team-results
          path: |
            playwright-report/
            test-results/
