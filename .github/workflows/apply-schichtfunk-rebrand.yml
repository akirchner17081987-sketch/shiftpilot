name: Apply SchichtFunk Rebrand
on:
  push:
    branches: [main]
    paths:
      - 'assets/schichtfunk-logo.svg'
      - 'assets/schichtfunk-rebrand.css'
      - 'assets/schichtfunk-rebrand.js'
      - '.github/workflows/apply-schichtfunk-rebrand.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply SchichtFunk branding
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="assets/schichtfunk-rebrand.css">'
          js='<script src="assets/schichtfunk-rebrand.js"></script>'
          changed=False
          # Sichtbare Hauptmarke direkt im HTML umstellen
          ns=s.replace('<title>ShiftPilot – Dienstplanung</title>','<title>SchichtFunk – Dienstplanung</title>')
          ns=ns.replace('assets/shiftpilot-logo.svg','assets/schichtfunk-logo.svg')
          ns=ns.replace('alt="ShiftPilot"','alt="SchichtFunk – Klar geplant. Stark besetzt."')
          ns=ns.replace('© 2026 ShiftPilot – Dienstplanung. Smart. Effizient.','© 2026 SchichtFunk – Klar geplant. Stark besetzt.')
          if ns!=s: s=ns; changed=True
          if css not in s:
              s=s.replace('</head>',css+'\n</head>'); changed=True
          if js not in s:
              s=s.replace('</body>',js+'\n</body>'); changed=True
          if changed: p.write_text(s,encoding='utf-8')
      - name: Verify branding
        run: |
          grep -q 'SchichtFunk – Dienstplanung' index.html
          grep -q 'schichtfunk-logo.svg' index.html
          grep -q 'schichtfunk-rebrand.js' index.html
          grep -q 'schichtfunk-rebrand.css' index.html
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "SchichtFunk branding already active."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Rebranding: ShiftPilot zu SchichtFunk"
          git push
