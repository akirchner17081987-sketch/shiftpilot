name: Schichtmodelle Browserprüfung
on:
  push:
    branches: [main, codex/ionos-migration]
    paths:
      - assets/shift-models-v1.js
      - assets/settings-management-v2.js
      - assets/auto-plan-workspace-v1.js
      - tests/auto-plan-workspace.test.mjs
      - tests/e2e/shift-models.spec.cjs
      - .github/workflows/shift-models-checks.yml
  workflow_dispatch:
permissions:
  contents: read
# Superseded checks may stop; deployment workflows use separate, protected groups.
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # The complete suite runs in Regressionstests and before the production upload.
      - run: node --test tests/shift-models.test.mjs tests/auto-plan-workspace.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/shift-models.spec.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shift-model-browser-results
          path: |
            playwright-report/
            test-results/
