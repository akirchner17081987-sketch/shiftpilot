name: Schichtmodelle Browserprüfung
on:
  push:
    branches: [main, codex/ionos-migration]
    paths:
      - assets/shift-models-v1.js
      - assets/settings-management-v2.js
      - tests/e2e/shift-models.spec.cjs
      - .github/workflows/shift-models-checks.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/shift-models.spec.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shift-model-browser-results
          path: |
            playwright-report/
            test-results/
