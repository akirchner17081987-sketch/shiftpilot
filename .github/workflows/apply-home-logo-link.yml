name: Apply Home Logo Link
on:
  push:
    paths:
      - 'scripts/apply_home_logo_link.py'
      - '.github/workflows/apply-home-logo-link.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/apply_home_logo_link.py
      - run: |
          git config user.name "shiftpilot-bot"
          git config user.email "shiftpilot-bot@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Navigation: Logo mit Startseite verlinken"
          git push
