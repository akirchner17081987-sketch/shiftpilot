name: Fix Dashboard Schedule Navigation
on:
  push:
    paths:
      - 'scripts/fix_dashboard_schedule_navigation.py'
      - '.github/workflows/fix-dashboard-schedule-navigation.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/fix_dashboard_schedule_navigation.py
      - run: |
          git config user.name "shiftpilot-bot"
          git config user.email "shiftpilot-bot@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Dashboard: Dienstplan öffnen korrekt verlinken"
          git push
