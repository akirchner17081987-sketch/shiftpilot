name: Apply QR Vault Recovery UI

on:
  push:
    branches:
      - qr-vault-recovery

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch QR terminal admin UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/supabase-qr-terminal-admin-v1.js')
          s = p.read_text(encoding='utf-8')

          old = '''  async function showTerminalQr(t){
    const path=knownQrPath(t.id);
    if(path){openQrModal(t,path);return}
    if(!confirm(`Der aktuelle QR-Code für „${t.name}“ ist in dieser Browser-Sitzung nicht mehr verfügbar. Soll jetzt ein neuer QR-Code erzeugt und direkt angezeigt werden? Der bisherige Ausdruck wird dadurch ungültig.`))return;
    await rotateTerminal(t,true);
  }'''
          new = '''  async function showTerminalQr(t){
    const path=knownQrPath(t.id);
    if(path){openQrModal(t,path);return}
    try{
      B.showLoading?.('QR-Code wird sicher geladen …');
      const q=await B.withAal2(()=>B.client.rpc('manager_get_time_qr_terminal_qr_path',{p_terminal_id:t.id}));
      if(q.error)throw q.error;
      if(!q.data?.qr_path)throw new Error('QR-Code konnte nicht geladen werden.');
      rememberQrPath(t.id,q.data.qr_path);
      openQrModal({...t,location_note:q.data.location_note||t.location_note},q.data.qr_path);
    }catch(e){
      const msg=rpcError(e);
      if(/nicht wiederherstellbar|Bitte QR erneuern/i.test(msg)){
        if(confirm(`Für „${t.name}“ liegt noch kein wiederherstellbarer QR-Schlüssel im sicheren Speicher. Soll jetzt ein neuer QR-Code erzeugt werden? Der bisherige Ausdruck wird dadurch ungültig.`))await rotateTerminal(t,true);
        return;
      }
      alert(msg);
    }finally{B.hideLoading?.()}
  }'''
          if old not in s:
              raise SystemExit('showTerminalQr source block not found')
          s = s.replace(old, new, 1)

          old_note = '<b>QR anzeigen</b> öffnet einen in dieser Browser-Sitzung bekannten QR erneut. Ist der Schlüssel hier nicht mehr verfügbar, bietet SchichtFunk kontrolliert an, einen neuen QR zu erzeugen. <b>QR erneuern</b> macht den bisherigen Ausdruck sofort ungültig.'
          new_note = '<b>QR anzeigen</b> öffnet den aktuell gültigen QR-Code. Falls er nicht mehr in dieser Browser-Sitzung vorliegt, lädt SchichtFunk ihn sicher aus dem verschlüsselten Serverspeicher. <b>QR erneuern</b> macht den bisherigen Ausdruck sofort ungültig.'
          if old_note not in s:
              raise SystemExit('QR note source block not found')
          s = s.replace(old_note, new_note, 1)

          old_warn = 'Diesen QR-Code speichern oder drucken. Innerhalb dieser Browser-Sitzung kann er über „QR anzeigen“ erneut geöffnet werden. SchichtFunk speichert den geheimen Terminalschlüssel weiterhin nicht im Klartext in der Datenbank. „QR erneuern“ macht den bisherigen Ausdruck sofort ungültig.'
          new_warn = 'Diesen QR-Code kannst du jederzeit erneut über „QR anzeigen“ öffnen. Der Terminalschlüssel liegt verschlüsselt im sicheren Serverspeicher; die normale Terminaltabelle enthält weiterhin nur den Prüf-Hash. „QR erneuern“ macht den bisherigen Ausdruck sofort ungültig.'
          if old_warn not in s:
              raise SystemExit('QR warning source block not found')
          s = s.replace(old_warn, new_warn, 1)

          p.write_text(s, encoding='utf-8')
          PY
          node --check assets/supabase-qr-terminal-admin-v1.js
      - name: Commit patched UI
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/supabase-qr-terminal-admin-v1.js
          git rm .github/workflows/apply-qr-vault-ui.yml
          git commit -m "Load current QR securely from Supabase Vault"
          git push origin HEAD:qr-vault-recovery
