name: Apply Absence Modal No Outside Close

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_absence_modal_no_outside_close.py'
      - '.github/workflows/apply-absence-modal-no-outside-close.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply modal behavior fix
        run: python scripts/apply_absence_modal_no_outside_close.py
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Abwesenheiten: Modal bleibt bei Außerklick geöffnet"
          git push
