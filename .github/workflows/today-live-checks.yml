name: Today live verification
on:
  push:
    branches: [codex/ionos-migration]
    paths:
      - 'assets/today-workspace*'
      - 'scripts/verify-today-live.py'
      - '.github/workflows/today-live-checks.yml'
jobs:
  verify-published-release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for and verify the exact IONOS release
        run: python scripts/verify-today-live.py
