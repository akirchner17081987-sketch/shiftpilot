name: IONOS + Supabase Integration CI

on:
  push:
    branches:
      - integration/ionos-supabase-technical
  pull_request:
    paths:
      - '.deploy-now/**'
      - '.github/workflows/**'
      - '.htaccess'
      - 'assets/demo-*.js'
      - 'demo.html'
      - 'scripts/build-static.mjs'
      - 'supabase/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:ionos
      - run: npm run build
