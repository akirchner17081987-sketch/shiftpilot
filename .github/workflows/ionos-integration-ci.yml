name: IONOS + Supabase Integration CI

on:
  push:
    branches:
      - integration/ionos-supabase-technical
  pull_request:
    paths:
      - '.deploy-now/**'
      - '.github/workflows/**'
      - '.htaccess'
      - 'assets/demo-*.js'
      - 'demo.html'
      - 'scripts/build-static.mjs'
      - 'supabase/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Regression tests
        id: regression
        continue-on-error: true
        run: npm test 2>&1 | tee npm-test.log
      - name: IONOS migration tests
        id: ionos
        continue-on-error: true
        run: npm run test:ionos 2>&1 | tee ionos-test.log
      - name: Static build
        id: build
        continue-on-error: true
        run: npm run build 2>&1 | tee build.log
      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ionos-supabase-verification-logs
          path: |
            npm-test.log
            ionos-test.log
            build.log
          if-no-files-found: error
      - name: Enforce verification result
        if: steps.regression.outcome != 'success' || steps.ionos.outcome != 'success' || steps.build.outcome != 'success'
        run: exit 1
