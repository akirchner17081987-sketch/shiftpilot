name: Orbit shell and navigation
on:
  push:
    branches: [codex/orbit-redesign-20261013, codex/statusglobus-standorte, codex/earth-close-view, codex/location-horizon-20261016]
  pull_request:
    paths: [index.html, 'assets/employee-home-*', 'assets/employee-portal-polish-*', assets/employee-orbit-v1.js, assets/employee-orbit-v1.css, assets/employee-shifts-month-v1.js, tests/browser/employee-home-qa.cjs, tests/browser/employee-portal-polish-qa.cjs, 'assets/orbit-shell-*', 'assets/location-map-*', assets/settings-management-v2.js, assets/help-center-content-v3.js, tests/browser/site-loading-qa.cjs, .github/workflows/orbit-shell-checks.yml]
permissions:
  contents: read
# Superseded checks may stop; deployment workflows use separate, protected groups.
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  orbit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The complete suite runs in Regressionstests and before the production upload.
      - run: node --test tests/employee-home.test.cjs tests/employee-shifts-month.test.cjs tests/employee-wage-preview.test.cjs tests/site-loading.test.cjs
      - run: npm run build
      - run: npm run test:ionos
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser/today-workspace-qa.cjs
      - run: node tests/browser/site-loading-qa.cjs
      - run: node tests/browser/employee-home-qa.cjs
      - run: node tests/browser/employee-portal-polish-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbit-navigation-qa
          path: |
            test-results/site-loading
            test-results/today-workspace
            test-results/employee-home
            test-results/employee-portal-polish
          retention-days: 7
