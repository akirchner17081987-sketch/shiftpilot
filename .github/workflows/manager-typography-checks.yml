name: Schriftgrößenprüfung
on:
  push:
    branches: [main, codex/ionos-migration, codex/readable-hints-20261006]
    paths:
      - index.html
      - assets/manager-typography-v1.css
      - assets/secondary-text-readability-v1.css
      - assets/settings-management-v2.js
      - assets/today-dashboard-v2.js
      - assets/schedule-month-view-v1.js
      - assets/schedule-week-board-v2-phase1.js
      - tests/e2e/manager-typography.spec.cjs
      - .github/workflows/manager-typography-checks.yml
  pull_request:
    paths:
      - index.html
      - assets/manager-typography-v1.css
      - tests/e2e/manager-typography.spec.cjs
      - .github/workflows/manager-typography-checks.yml
jobs:
  typography:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright test tests/e2e/manager-typography.spec.cjs tests/e2e/kpi-layout.spec.cjs --project=desktop-chromium --retries=0 --max-failures=3
        env:
          E2E_BASE_URL: http://typography.test
          SF_TYPOGRAPHY_BROWSER: /usr/bin/google-chrome
          SF_KPI_LAYOUT_BROWSER: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manager-typography-results
          path: |
            playwright-report/
            test-results/
