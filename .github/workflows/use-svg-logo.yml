name: Use SVG Logo
on:
  push:
    paths:
      - 'scripts/use_svg_logo.py'
      - '.github/workflows/use-svg-logo.yml'
      - 'assets/shiftpilot-logo.svg'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/use_svg_logo.py
      - run: |
          git config user.name "shiftpilot-bot"
          git config user.email "shiftpilot-bot@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Logo: auf stabiles SVG umstellen"
          git push
