name: Dienstplan Modulprüfung
on:
  push:
    branches: [main]
    paths:
      - assets/compliance-core-v2.js
      - assets/compliance-workflow-v2.js
      - assets/schedule-month-view-v1.js
      - assets/supabase-absence-planning-guard-v2.js
      - assets/conflict-plausibility-v1.js
      - tests/e2e/schedule-module-regressions.spec.cjs
      - .github/workflows/schedule-module-checks.yml
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/schedule-module-regressions.spec.cjs tests/e2e/schedule-publication-period.spec.cjs tests/e2e/employee-planning-teams.spec.cjs tests/e2e/auto-plan-workspace.spec.cjs tests/e2e/shift-models.spec.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schedule-module-results
          path: |
            playwright-report/
            test-results/
