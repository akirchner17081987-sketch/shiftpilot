name: Apply Absence Dedup Fix
on:
  push:
    paths:
      - 'scripts/apply_absence_dedup_fix.py'
      - '.github/workflows/apply-absence-dedup-fix.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/apply_absence_dedup_fix.py
      - run: |
          git config user.name "shiftpilot-bot"
          git config user.email "shiftpilot-bot@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Abwesenheiten: doppelte Überschriften entfernen"
          git push
