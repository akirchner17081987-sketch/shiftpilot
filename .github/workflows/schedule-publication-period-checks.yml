name: Dienstplan Veröffentlichungszeitraum Browserprüfung
on:
  push:
    branches: [main, codex/ionos-migration]
    paths:
      - assets/supabase-publish-v1.js
      - assets/schedule-month-view-v1.js
      - tests/schedule-publication-period.test.mjs
      - tests/e2e/schedule-publication-period.spec.cjs
      - .github/workflows/schedule-publication-period-checks.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/schedule-publication-period.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/schedule-publication-period.spec.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schedule-publication-period-results
          path: |
            playwright-report/
            test-results/
