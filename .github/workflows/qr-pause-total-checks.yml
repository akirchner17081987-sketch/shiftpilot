name: QR Pausensumme Prüfung
on:
  push:
    branches: [main, codex/ionos-migration, codex/qr-pause-total-20261006]
    paths:
      - qr-time.html
      - assets/qr-pause-total-v1.js
      - tests/qr-pause-total.test.mjs
      - tests/supabase-qr-time-migration.test.mjs
      - tests/e2e/qr-pause-total.spec.cjs
      - tests/browser/qr-forgotten-pause-qa.cjs
      - package.json
      - .github/workflows/qr-pause-total-checks.yml
  pull_request:
    paths:
      - qr-time.html
      - assets/qr-pause-total-v1.js
      - tests/qr-pause-total.test.mjs
      - tests/supabase-qr-time-migration.test.mjs
      - tests/e2e/qr-pause-total.spec.cjs
      - tests/browser/qr-forgotten-pause-qa.cjs
jobs:
  qr-pause:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/qr-pause-total.test.mjs tests/supabase-qr-time-migration.test.mjs
      - run: npx playwright test tests/e2e/qr-pause-total.spec.cjs --retries=0 --max-failures=2
        env:
          E2E_BASE_URL: http://qr-pause.test
          SF_QR_BROWSER_EXECUTABLE: /usr/bin/google-chrome
      - run: node tests/browser/qr-forgotten-pause-qa.cjs
        env:
          SF_QR_BROWSER_EXECUTABLE: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qr-pause-total-results
          path: |
            playwright-report/
            test-results/
