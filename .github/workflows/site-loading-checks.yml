name: Site loading and dependencies
on:
  push:
    branches: [main, codex/ionos-migration, codex/faster-authenticated-startup-20261011, codex/site-loading-performance-20261011, codex/auto-plan-progress-20261011]
    paths: [index.html, demo.html, qr-time.html, 'assets/**', 'tests/site-loading.test.cjs', 'tests/startup-workspaces.test.cjs', 'tests/regression.test.mjs', 'tests/e2e/auto-plan-workspace.spec.cjs', 'tests/month-optimizer.test.mjs', 'tests/browser/site-loading-qa.cjs', '.github/workflows/site-loading-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
# Superseded checks may stop; deployment workflows use separate, protected groups.
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  loading:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The complete suite runs in Regressionstests and before the production upload.
      - run: node --test tests/site-loading.test.cjs tests/startup-workspaces.test.cjs tests/performance-loader.test.cjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser/site-loading-qa.cjs
        env:
          SF_SITE_LOADING_BASE: ad5b370599ae659ae03921f3b46a0e5ab5a74819
      # Planning browser flows are owned by auto-plan-workspace-checks.yml.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-loading-qa
          path: |
            test-results/
            playwright-report/
          retention-days: 7

