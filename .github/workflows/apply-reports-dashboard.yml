name: Apply Reports Dashboard
on:
  push:
    paths:
      - 'scripts/apply_reports_dashboard.py'
      - '.github/workflows/apply-reports-dashboard.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/apply_reports_dashboard.py
      - run: |
          git config user.name "shiftpilot-bot"
          git config user.email "shiftpilot-bot@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Auswertungen: erstes Controlling-Dashboard"
          git push
