name: Apply Dark Home Preview
on:
  push:
    paths:
      - 'scripts/apply_dark_home_preview.py'
      - '.github/workflows/apply-dark-home-preview.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/apply_dark_home_preview.py
      - run: |
          git config user.name "shiftpilot-bot"
          git config user.email "shiftpilot-bot@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Homepage: Dashboard-Vorschau farblich angleichen"
          git push
