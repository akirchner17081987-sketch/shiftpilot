name: Fix Logo Path
on:
  push:
    paths:
      - 'scripts/fix_logo_path.py'
      - '.github/workflows/fix-logo-path.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/fix_logo_path.py
      - run: |
          git config user.name "shiftpilot-bot"
          git config user.email "shiftpilot-bot@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Logo-Pfad auf PNG korrigieren"
          git push
