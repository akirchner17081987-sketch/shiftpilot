name: Fix Reports Dashboard V2
on:
  push:
    paths:
      - 'scripts/fix_reports_dashboard_v2.py'
      - '.github/workflows/fix-reports-dashboard-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/fix_reports_dashboard_v2.py
      - run: |
          git config user.name "shiftpilot-bot"
          git config user.email "shiftpilot-bot@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Auswertungen: vollständiges Dashboard anzeigen"
          git push
