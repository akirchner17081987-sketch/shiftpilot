name: Apply Absence Page Final Design
on:
  push:
    paths:
      - 'scripts/apply_absence_page_final_design.py'
      - '.github/workflows/apply-absence-page-final-design.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/apply_absence_page_final_design.py
      - run: |
          git config user.name "shiftpilot-bot"
          git config user.email "shiftpilot-bot@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Abwesenheiten: finales Seitendesign übernehmen"
          git push
