name: Apply OT Weekend Holiday Policy
on:
  push:
    branches: [main]
    paths:
      - 'assets/ot-weekend-holiday-policy.js'
      - 'assets/ot-weekend-holiday-policy.css'
      - '.github/workflows/apply-ot-weekend-holiday-policy.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link OT policy assets
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="assets/ot-weekend-holiday-policy.css">'
          js='<script src="assets/ot-weekend-holiday-policy.js"></script>'
          changed=False
          if css not in s:
              s=s.replace('</head>',css+'\n</head>');changed=True
          if js not in s:
              s=s.replace('</body>',js+'\n</body>');changed=True
          if changed:p.write_text(s,encoding='utf-8')
      - name: Basic checks
        run: |
          grep -q 'ot-weekend-holiday-policy.css' index.html
          grep -q 'ot-weekend-holiday-policy.js' index.html
          grep -q 'shiftPilotOtApplies' assets/ot-weekend-holiday-policy.js
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "OT policy already linked."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Einstellungen: OT nur Wochenende und Feiertag aktivieren"
          git push
