name: Staffing simulator live verification
on:
  push:
    branches: [codex/ionos-migration]
    paths:
      - 'assets/staffing-simulator-*'
      - 'assets/wish-planning-*'
      - 'assets/shift-handover-*'
      - 'assets/compliance-core-v2.js'
      - 'assets/auto-plan-workspace-v1.js'
      - 'assets/auto-plan-period-v1.css'
      - 'assets/supabase-data-v1.js'
      - 'assets/conflict-plausibility-v1.js'
      - 'index.html'
      - 'assets/help-center-content-v3.js'
      - 'scripts/verify-staffing-live.py'
      - '.github/workflows/staffing-live-checks.yml'
jobs:
  verify-published-release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for and verify the exact IONOS release
        run: python scripts/verify-staffing-live.py
