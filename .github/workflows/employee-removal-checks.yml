name: Mitarbeiterstatus und Löschung Browserprüfung
on:
  push:
    branches: [main, codex/ionos-migration]
    paths:
      - assets/employee-removal-v1.js
      - assets/employee-management-v2.js
      - assets/supabase-data-v1.js
      - tests/employee-status.test.mjs
      - tests/e2e/employee-status.spec.cjs
      - tests/e2e/employee-removal.spec.cjs
      - .github/workflows/employee-removal-checks.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/employee-status.test.mjs tests/employee-removal.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/employee-removal.spec.cjs tests/e2e/employee-status.spec.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: employee-removal-browser-results
          path: |
            playwright-report/
            test-results/
