name: Apply Assignment Quick Delete V1
on:
  push:
    branches: [main]
    paths:
      - 'assets/assignment-quick-delete-v1.js'
      - 'assets/assignment-quick-delete-v1.css'
      - '.github/workflows/apply-assignment-quick-delete-v1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link quick delete assets
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="assets/assignment-quick-delete-v1.css">'
          js='<script src="assets/assignment-quick-delete-v1.js"></script>'
          if css not in s:
              s=s.replace('</head>',css+'\n</head>')
          if js not in s:
              s=s.replace('</body>',js+'\n</body>')
          p.write_text(s,encoding='utf-8')
      - name: Verify
        run: |
          grep -q 'assignment-quick-delete-v1.css' index.html
          grep -q 'assignment-quick-delete-v1.js' index.html
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Dienstplan: Schnelllöschung an Schichtblöcken aktivieren"
          git push
