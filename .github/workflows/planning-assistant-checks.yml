name: Planning assistant checks
on:
  pull_request:
    paths:
      - 'assets/planning-assistant-*.js'
      - 'assets/planning-assistant-*.css'
      - 'assets/planning-learning-*'
      - 'assets/planning-timeline-*'
      - 'assets/planning-experience-*'
      - 'tests/planning-experience*'
      - 'tests/e2e/planning-experience*'
      - 'tests/planning-assistant*.test.*'
      - 'tests/browser/planning-assistant-*'
      - 'tests/e2e/planning-assistant*.spec.cjs'
      - 'supabase/migrations/*planning_assistant*'
      - 'index.html'
      - '.github/workflows/planning-assistant-checks.yml'
  push:
    branches: [codex/ionos-migration]
    paths:
      - 'assets/planning-assistant-*.js'
      - 'assets/planning-assistant-*.css'
      - 'assets/planning-learning-*'
      - 'assets/planning-timeline-*'
      - 'assets/planning-experience-*'
      - 'tests/planning-experience*'
      - 'tests/e2e/planning-experience*'
      - 'tests/planning-assistant*.test.*'
      - 'tests/browser/planning-assistant-*'
      - 'tests/e2e/planning-assistant*.spec.cjs'
      - 'supabase/migrations/*planning_assistant*'
      - 'index.html'
      - '.github/workflows/planning-assistant-checks.yml'
# Superseded checks may stop; deployment workflows use separate, protected groups.
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node --test tests/planning-assistant.test.mjs tests/planning-assistant-report.test.cjs tests/planning-assistant-goals.test.cjs tests/planning-assistant-goals-sql.test.cjs tests/planning-assistant-insights.test.cjs tests/planning-assistant-bottlenecks.test.cjs tests/planning-assistant-scenarios.test.cjs tests/planning-assistant-workflows.test.cjs tests/planning-assistant-workflows-sql.test.cjs tests/planning-assistant-productivity.test.cjs tests/planning-assistant-profiles-sql.test.cjs tests/planning-assistant-learning-sql.test.cjs tests/planning-experience.test.cjs tests/solid-planning.test.cjs tests/solid-planning-ui.test.cjs
      - run: node scripts/build-static.mjs
      - run: npx playwright install ffmpeg
      - run: npx playwright test tests/e2e/planning-assistant.spec.cjs tests/e2e/planning-assistant-report.spec.cjs tests/e2e/planning-assistant-dialog.spec.cjs tests/e2e/planning-assistant-goals.spec.cjs tests/e2e/planning-assistant-insights.spec.cjs tests/e2e/planning-assistant-bottlenecks.spec.cjs tests/e2e/planning-assistant-scenarios.spec.cjs tests/e2e/planning-assistant-workflows.spec.cjs tests/e2e/planning-assistant-productivity.spec.cjs tests/e2e/planning-experience.spec.cjs
        env:
          SF_ASSISTANT_BROWSER_EXECUTABLE: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: planning-assistant-browser-results
          path: |
            playwright-report/
            test-results/

