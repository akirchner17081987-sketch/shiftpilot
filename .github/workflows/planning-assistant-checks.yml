name: Planning assistant checks
on:
  pull_request:
    paths:
      - 'assets/planning-assistant-*.js'
      - 'assets/planning-assistant-*.css'
      - 'tests/planning-assistant.test.mjs'
      - 'tests/browser/planning-assistant-*'
      - 'tests/e2e/planning-assistant.spec.cjs'
      - 'index.html'
      - '.github/workflows/planning-assistant-checks.yml'
  push:
    branches: [main]
    paths:
      - 'assets/planning-assistant-*.js'
      - 'assets/planning-assistant-*.css'
      - 'tests/planning-assistant.test.mjs'
      - 'tests/browser/planning-assistant-*'
      - 'tests/e2e/planning-assistant.spec.cjs'
      - 'index.html'
      - '.github/workflows/planning-assistant-checks.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/planning-assistant.test.mjs
      - run: node scripts/build-static.mjs
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/planning-assistant.spec.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: planning-assistant-browser-results
          path: |
            playwright-report/
            test-results/

