name: Vollständige Mitarbeiterlöschung
on:
 push:
  branches: [main, codex/ionos-migration, codex/employee-full-erasure]
  paths: ['assets/**','supabase/**','tests/**','.github/workflows/employee-erasure-checks.yml']
 workflow_dispatch:
jobs:
 erasure:
  runs-on: ubuntu-latest
  timeout-minutes: 10
  permissions:
   contents: read
  services:
   postgres:
    image: postgres:17
    env:
     POSTGRES_PASSWORD: fictitious-ci-password
     POSTGRES_DB: employee_erasure_test
    ports: ['5432:5432']
    options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with:
      node-version: '22'
   - run: node --test tests/employee-erasure.test.mjs
   - run: npm ci
   - run: npx playwright install --with-deps chromium
   - name: Desktop and mobile deletion dialog with fictitious responses
     run: node tests/browser/employee-erasure-qa.cjs
   - name: Fictitious employees, closed-month history, mixed audits, permissions and retry safety
     run: |
      psql -v ON_ERROR_STOP=1 -f tests/sql/employee-erasure-bootstrap.sql
      psql -v ON_ERROR_STOP=1 -f supabase/employee-full-erasure.sql
      psql -v ON_ERROR_STOP=1 -f supabase/employee-full-erasure-guards.sql
      psql -v ON_ERROR_STOP=1 -f tests/sql/employee-erasure-integration.sql
     env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: fictitious-ci-password
      PGDATABASE: employee_erasure_test
