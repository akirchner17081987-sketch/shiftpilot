name: Unternehmensprofil und Standortzuordnungen
on:
  pull_request:
    paths:
      - assets/company-profile-v1.*
      - assets/settings-management-v2.js
      - assets/employee-profile-v1.js
      - assets/shift-models-v1.js
      - assets/schedule-export-*.js
      - assets/supabase-qr-terminal-admin-v1.js
      - assets/supabase-report-pdf-style-v4.js
      - supabase/migrations/*company_profile*.sql
      - tests/company-profile.test.cjs
      - tests/browser/company-profile-qa.cjs
      - .github/workflows/company-profile-checks.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  company-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/company-profile.test.cjs tests/schedule-export.test.mjs tests/shift-models.test.mjs tests/qr-terminal-admin.test.mjs
      - run: node tests/browser/company-profile-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unternehmensprofil-pruefung
          path: test-results/company-profile/
          retention-days: 7
