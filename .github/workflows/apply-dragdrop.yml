name: Apply Drag and Drop Patch

on:
  push:
    paths:
      - 'scripts/apply_dragdrop.py'
      - 'scripts/trigger_dragdrop.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/apply_dragdrop.py
      - name: Commit updated app
        run: |
          git config user.name "shiftpilot-bot"
          git config user.email "shiftpilot-bot@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Dienstplan: Mitarbeiter Drag & Drop hinzufügen"
          git push
