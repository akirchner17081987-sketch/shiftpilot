name: Expand template manager (legacy)

# Legacy-Workflow: Die Vorlagenverwaltung wird inzwischen über
# assets/template-manager.js + apply-template-manager.yml bereitgestellt.
# Dieser Workflow bleibt nur für historische/manuelle Wiederherstellung erhalten
# und läuft nicht mehr automatisch bei jedem Push.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  info:
    runs-on: ubuntu-latest
    steps:
      - name: Legacy workflow disabled
        run: echo "Legacy template expansion is disabled. Use assets/template-manager.js and Apply Template Manager instead."
