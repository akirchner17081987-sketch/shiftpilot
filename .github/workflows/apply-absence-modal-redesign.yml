name: Apply Absence Modal Redesign
on:
  push:
    paths:
      - 'scripts/apply_absence_modal_redesign.py'
      - '.github/workflows/apply-absence-modal-redesign.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/apply_absence_modal_redesign.py
      - run: |
          git config user.name "shiftpilot-bot"
          git config user.email "shiftpilot-bot@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Abwesenheiten: Antrag als ShiftPilot-Modal gestalten"
          git push
