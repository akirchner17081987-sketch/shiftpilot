name: Audit workspace checks
on:
  push:
    branches: [codex/audit-workspace-20261010, codex/ionos-migration]
    paths: ["assets/audit-logs*", "tests/audit-workspace*", "tests/audit-permission-scan*", "database/audit-*", "tests/browser/audit-workspace*", ".github/workflows/audit-workspace-checks.yml", "supabase/migrations/*audit_workspace*", "supabase/migrations/*audit_permission*"]
  pull_request:
    paths: ["assets/audit-logs*", "tests/audit-workspace*", "tests/audit-permission-scan*", "database/audit-*", "tests/browser/audit-workspace*", ".github/workflows/audit-workspace-checks.yml", "supabase/migrations/*audit_workspace*", "supabase/migrations/*audit_permission*"]
permissions:
  contents: read
# Superseded checks may stop; deployment workflows use separate, protected groups.
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:audit
      - run: node --test tests/audit-archives-ui.test.mjs tests/reports-workspace.test.cjs
      - run: node tests/browser/reports-workspace-qa.cjs
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-workspace-evidence
          path: test-results/audit-workspace/
