name: Apply Dynamic Employee Pool V1
on:
  push:
    branches: [main]
    paths:
      - 'assets/dynamic-employee-pool-v1.css'
      - 'assets/dynamic-employee-pool-v1.js'
      - '.github/workflows/apply-dynamic-employee-pool-v1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link dynamic pool assets
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="assets/dynamic-employee-pool-v1.css">'
          js='<script src="assets/dynamic-employee-pool-v1.js"></script>'
          changed=False
          if css not in s:
              s=s.replace('</head>',css+'\n</head>'); changed=True
          if js not in s:
              s=s.replace('</body>',js+'\n</body>'); changed=True
          if changed: p.write_text(s,encoding='utf-8')
      - name: Basic checks
        run: |
          grep -q 'dynamic-employee-pool-v1.css' index.html
          grep -q 'dynamic-employee-pool-v1.js' index.html
          grep -q 'sp-dynpool-info' assets/dynamic-employee-pool-v1.js
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "Dynamic employee pool already linked."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Dienstplan: dynamischen Mitarbeiter-Pool aktivieren"
          git push
