name: Public site response timings
on:
  pull_request:
    paths:
      - scripts/measure-site-response.py
      - .github/workflows/site-response-checks.yml
  push:
    branches: [codex/ionos-migration]
    paths:
      - scripts/measure-site-response.py
      - .github/workflows/site-response-checks.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  response:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Measure public IONOS responses independently of the assistant connection
        run: python3 scripts/measure-site-response.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-site-response-${{ github.run_id }}
          path: artifacts/site-response.json
          retention-days: 14
