name: Entry access and recovery checks
on:
  push:
    branches: [main, codex/ionos-migration]
    paths:
      - assets/sf-entry-access-v1.js
      - assets/supabase-auth-v1.js
      - assets/supabase-password-reset-v1.js
      - impressum.html
      - datenschutz.html
      - tests/entry-access-usability.test.mjs
      - tests/browser/entry-access-qa.cjs
      - .github/workflows/entry-access-usability-checks.yml
  pull_request:
    paths:
      - assets/sf-entry-access-v1.js
      - assets/supabase-auth-v1.js
      - assets/supabase-password-reset-v1.js
      - impressum.html
      - datenschutz.html
      - tests/entry-access-usability.test.mjs
      - tests/browser/entry-access-qa.cjs
      - .github/workflows/entry-access-usability-checks.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  entry-access:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/entry-access-usability.test.mjs tests/entry-loading-v2.test.mjs tests/pwa-entry-start.test.mjs tests/portal-entry-routing.test.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser/entry-access-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: entry-access-results
          path: test-results/entry-access/
