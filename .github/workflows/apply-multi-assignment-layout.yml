name: Apply Multi Assignment Layout
on:
  push:
    paths:
      - 'scripts/apply_multi_assignment_layout.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'shiftpilot-bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/apply_multi_assignment_layout.py
      - name: Commit changes
        run: |
          git config user.name "shiftpilot-bot"
          git config user.email "shiftpilot-bot@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Dienstplan: Mehrfachbelegung nebeneinander anzeigen"
          git push
